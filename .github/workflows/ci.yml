# The gate on Linux, Windows and macOS (closes G9), overlay snapshots, an end-to-end run on Linux,
# and the tester packages as artifacts. Tags v* also get a DRAFT release: a human publishes it.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Docs-only pushes (devlog, gaps, ROADMAP…) don't change what the gate checks. Path filters
    # are not evaluated for tag pushes, so a release tag always runs everything.
    paths-ignore: ["**.md", "docs/**", "log/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_PYTHON_PREFERENCE: managed

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Cache the IntelliJ Platform (PyCharm download)
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/idea
          key: pycharm-2026.2.3-${{ runner.os }}
      - name: Qt and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: scripts/check (Linux, under Xvfb)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" ./scripts/check
      - name: scripts/check
        if: runner.os != 'Linux'
        run: ./scripts/check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ runner.os }}
          path: |
            ide-pycharm/build/test-results/
            ide-pycharm/build/reports/tests/
      - name: Overlay demo snapshots
        env:
          # Native rendering where the runner has a display (Xvfb on Linux, the desktop session on
          # Windows): Qt's offscreen backend has no fonts on Windows and draws every glyph as a box.
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'xcb' || (runner.os == 'Windows' && 'windows' || 'offscreen') }}
        run: |
          cmd="uv run --project overlay codebuddy-overlay --demo --snapshots snapshots/${{ runner.os }}"
          if [ "${{ runner.os }}" = Linux ]; then xvfb-run -a --server-args="-screen 0 1920x1080x24" $cmd; else $cmd; fi
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-snapshots-${{ runner.os }}
          path: snapshots/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: plugin-zip
          path: ide-pycharm/build/distributions/*.zip

  e2e-linux:
    name: e2e (fake trigger → brain stub → overlay, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: End to end
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run --project brain python scripts/e2e_overlay.py e2e-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-linux
          path: e2e-out/

  e2e-wayland:
    name: e2e (overlay on Wayland with a top bar, Sway headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sway, XWayland and Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq sway xwayland grim x11-utils libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libegl1 libgl1 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Overlay under swaybar
        run: uv run --project overlay python scripts/e2e_wayland.py e2e-wayland
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-wayland
          path: e2e-wayland/

  package:
    name: package (${{ matrix.os }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: plugin
      - name: Qt and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - name: Build
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'xcb' || (runner.os == 'Windows' && 'windows' || 'offscreen') }}
        run: |
          cmd="uv run --project overlay python packaging/build.py --plugin $(ls plugin/codebuddy-pycharm-*.zip)"
          if [ "${{ runner.os }}" = Linux ]; then xvfb-run -a --server-args="-screen 0 1920x1080x24" $cmd; else $cmd; fi
      - name: End to end on the packaged build
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'xcb' || (runner.os == 'Windows' && 'windows' || 'offscreen') }}
        run: |
          bundle=$(ls -d dist/CodeBuddy-*/ | head -1)
          cmd="uv run --project brain python scripts/e2e_overlay.py e2e-bundle --bundle $bundle"
          if [ "${{ runner.os }}" = Linux ]; then xvfb-run -a --server-args="-screen 0 1920x1080x24" $cmd; else $cmd; fi
      - uses: actions/upload-artifact@v4
        with:
          name: codebuddy-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-check-${{ runner.os }}
          path: |
            dist/bundle-snapshots-*/
            e2e-bundle/

  draft-release:
    name: draft release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, e2e-linux, e2e-wayland]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codebuddy-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: release
      - name: Create a draft release (never published by CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" \
            --draft --title "CodeBuddy ${GITHUB_REF_NAME} (testers)" \
            --notes "Unsigned tester builds for Linux and Windows, plus the PyCharm plugin. See INSTALL.md."
