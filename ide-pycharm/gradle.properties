group = dev.codebuddy
version = 0.1.0

# The IDE bundles the Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true

# Build and test against the PyCharm installed on this Mac (no multi-GB download).
# Override with -PpycharmPath=... on another machine.
pycharmPath = /Applications/PyCharm.app
