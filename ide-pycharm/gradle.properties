group = dev.codebuddy
version = 0.1.2

# The IDE bundles the Kotlin stdlib -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true

# Build and test against the PyCharm installed on this Mac (no multi-GB download). When that path
# doesn't exist (CI, Linux, Windows), PyCharm pycharmVersion is downloaded instead.
pycharmPath = /Applications/PyCharm.app
pycharmVersion = 2026.2.3
